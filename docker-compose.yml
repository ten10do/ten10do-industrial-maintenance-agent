# Compose file for the Industrial Maintenance Agent.
#
# Two services, and only one of them is started by a plain "up":
#
#   agent      the default standalone agent. Deterministic rule planner, no
#              credential, no RAG checkout.
#   agent-rag  the optional RAG-enabled agent. Behind the "rag" profile, so it
#              is built and started only when that profile is named.
#
#   docker compose up -d                  -> agent
#   docker compose --profile rag up -d agent-rag   -> agent-rag
#
# The RAG service needs the optional local dependency set baked into its image,
# which is what the INSTALL_RAG_DEPS build argument below selects. Mounting the
# RAG checkout alone is not sufficient.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Default shape: core dependencies only.
        INSTALL_RAG_DEPS: "0"
    image: industrial-maintenance-agent:0.8.4
    container_name: industrial-maintenance-agent
    ports:
      - "8000:8000"
    environment:
      # --- Planner ---
      # rule = deterministic planner, no LLM, no credential required (default)
      # llm  = LLM planner only; a failure is reported, never silently downgraded
      # auto = LLM planner first, then the rule planner if the LLM cannot plan
      PLANNER_MODE: rule
      LOG_LEVEL: INFO

      # --- Persistence ---
      # Relative to the image WORKDIR. The named volume below holds the database.
      DATABASE_URL: sqlite:///./data/industrial_maintenance.db
      AUTO_CREATE_TABLES: "true"

      # --- Optional LLM planner (only used when PLANNER_MODE is llm or auto) ---
      # Supply the secret through your shell or an env file, never in this file:
      #   LLM_BASE_URL: https://api.example.com/v1
      #   LLM_MODEL: your-model
      #   LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in your shell before enabling the LLM planner}

    volumes:
      # Database and any generated runtime data.
      - agent-data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    restart: unless-stopped

  agent-rag:
    profiles: ["rag"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # RAG shape: adds requirements-rag-local.txt on top of the core set.
        INSTALL_RAG_DEPS: "1"
    image: industrial-maintenance-agent:0.8.4-rag
    container_name: industrial-maintenance-agent-rag
    ports:
      # Separate host port so both services can run side by side.
      - "${RAG_HOST_PORT:-8001}:8000"
    environment:
      PLANNER_MODE: rule
      LOG_LEVEL: INFO

      DATABASE_URL: sqlite:///./data/industrial_maintenance.db
      AUTO_CREATE_TABLES: "true"

      # --- RAG integration ---
      # The local provider imports the retrieval engine from the mounted
      # checkout in-process. It needs the optional dependency set, which this
      # service's image installs.
      RAG_PROVIDER: local
      RAG_REPO_ROOT: /rag
      RAG_BACKEND: light
      RAG_RETRIEVAL_MODE: hybrid

    volumes:
      # Separate database volume so the two services never share a file.
      - agent-rag-data:/app/data
      # Read-only bind mount of an external Industrial Knowledge RAG checkout.
      # The container never writes to it. Set RAG_HOST_REPO to your local clone;
      # the default assumes a sibling directory next to this repository and is
      # a placeholder, not a real location.
      - ${RAG_HOST_REPO:-../industrial-knowledge-rag}:/rag:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    restart: unless-stopped

volumes:
  agent-data:
  agent-rag-data:
